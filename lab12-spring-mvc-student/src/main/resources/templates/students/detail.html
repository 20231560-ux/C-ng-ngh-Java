<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sinh viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Chi tiết sinh viên</h1>

    <table class="detail-table">
        <tr><th>ID</th><td th:text="${student.id}"></td></tr>
        <tr><th>Mã sinh viên</th><td th:text="${student.studentCode}"></td></tr>
        <tr><th>Họ tên</th><td th:text="${student.fullName}"></td></tr>
        <tr><th>Email</th><td th:text="${student.email}"></td></tr>
        <tr><th>Lớp</th><td th:text="${student.className}"></td></tr>
    </table>

    <a th:href="@{/students/edit/{id}(id=${student.id})}">Sửa</a> |
    <a th:href="@{/students}">Quay lại danh sách</a>
</div>
</body>
</html>
