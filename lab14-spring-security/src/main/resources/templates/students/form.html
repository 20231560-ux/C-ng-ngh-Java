<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Sinh viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="container">
    <div class="panel">
        <h1 th:text="${formTitle}">Sinh viên</h1>

        <form th:action="${student.id} == null ? @{/students/create} : @{/students/edit/{id}(id=${student.id})}"
              th:object="${student}" method="post">

            <label for="code">Mã sinh viên</label>
            <input type="text" id="code" th:field="*{code}">
            <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>

            <label for="fullName">Họ tên</label>
            <input type="text" id="fullName" th:field="*{fullName}">
            <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}">
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label for="className">Lớp</label>
            <input type="text" id="className" th:field="*{className}">

            <p style="margin-top:18px">
                <button class="btn" type="submit">Lưu</button>
                <a class="btn secondary" th:href="@{/students}">Hủy</a>
            </p>
        </form>
    </div>
</div>
</body>
</html>
