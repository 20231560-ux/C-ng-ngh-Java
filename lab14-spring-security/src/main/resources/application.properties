spring.application.name=lab14-spring-security
server.port=8080

# CSDL H2 chay trong bo nho, du lieu tao lai moi lan khoi dong
spring.datasource.url=jdbc:h2:mem:lab14db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Xem bang app_user tai http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
