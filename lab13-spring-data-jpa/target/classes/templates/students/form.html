<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pageTitle}">Thêm sinh viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <h1 th:text="${pageTitle}">Thêm sinh viên</h1>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/students}">Sinh viên</a>
        <a th:href="@{/courses}">Môn học</a>
    </nav>
</header>
<div class="container">
    <div class="card">
        <form th:action="@{/students/save}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Mã sinh viên</label>
                <input type="text" th:field="*{studentCode}"/>
                <div class="error" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}"></div>
            </div>

            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" th:field="*{fullName}"/>
                <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}"/>
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label>Lớp</label>
                <input type="text" th:field="*{className}"/>
            </div>

            <button class="btn" type="submit">Lưu</button>
            <a class="btn btn-light" th:href="@{/students}">Hủy</a>
        </form>
    </div>
</div>
</body>
</html>
