# ==== Bai 6 (muc 6 de bai): Cau hinh CSDL H2 ====
spring.application.name=lab13-spring-data-jpa
server.port=8080

spring.datasource.url=jdbc:h2:mem:eautdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:eautdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cho phep chay data.sql sau khi Hibernate tao bang
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Thymeleaf: tat cache de sua giao dien khong can restart
spring.thymeleaf.cache=false
