# ==== Bai 10: Chuyen cau hinh tu H2 sang MySQL ====
# Cach chay: them VM/Program argument --spring.profiles.active=mysql
# hoac trong Eclipse: Run Configurations > Arguments > Program arguments:
#     --spring.profiles.active=mysql
#
# Truoc do tao CSDL trong MySQL:
#     CREATE DATABASE eautdb CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

spring.datasource.url=jdbc:mysql://localhost:3306/eautdb?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false
spring.sql.init.mode=never
