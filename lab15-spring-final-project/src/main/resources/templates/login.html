<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Lab 15</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<div class="login-box">
    <h1>LAB 15</h1>
    <p>Quản lý sinh viên và đăng ký học phần</p>

    <div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất.</div>
    <div class="alert error" th:if="${param.error}">Sai tài khoản hoặc mật khẩu.</div>

    <form th:action="@{/login}" method="post">
        <label>Tài khoản</label>
        <input type="text" name="username" placeholder="Nhập tài khoản" required>

        <label>Mật khẩu</label>
        <input type="password" name="password" placeholder="Nhập mật khẩu" required>

        <button class="btn primary" type="submit">Đăng nhập</button>
    </form>

    <div class="demo-account">
        <b>Tài khoản demo</b><br>
        ADMIN: admin / 123456<br>
        USER: user / 123456
    </div>
</div>
</body>
</html>
