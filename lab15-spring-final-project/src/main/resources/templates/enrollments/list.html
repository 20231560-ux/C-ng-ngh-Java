<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký học phần</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <div class="brand">LAB 15</div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a><a href="/students">Sinh viên</a><a href="/courses">Môn học</a>
        <a href="/enrollments">Đăng ký học phần</a>
        <form th:action="@{/logout}" method="post" class="logout-form"><button type="submit">Đăng xuất</button></form>
    </div>
</nav>
<main class="container">
    <div class="page-head"><h1>Danh sách đăng ký học phần</h1><a class="btn primary" href="/enrollments/create">+ Đăng ký học phần</a></div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <table>
        <thead><tr><th>ID</th><th>Sinh viên</th><th>Môn học</th><th>Ngày đăng ký</th><th>Thao tác</th></tr></thead>
        <tbody>
        <tr th:each="e : ${enrollments}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.student.studentCode + ' - ' + e.student.fullName}"></td>
            <td th:text="${e.course.courseCode + ' - ' + e.course.courseName}"></td>
            <td th:text="${e.enrollDate}"></td>
            <td><a class="btn small danger" th:href="@{/enrollments/delete/{id}(id=${e.id})}" onclick="return confirm('Hủy đăng ký học phần này?')">Hủy đăng ký</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(enrollments)}"><td colspan="5" class="empty">Chưa có đăng ký.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
