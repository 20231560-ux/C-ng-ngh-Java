<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sinh viên</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <div class="brand">LAB 15</div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/students">Sinh viên</a>
        <a href="/courses">Môn học</a>
        <a href="/enrollments">Đăng ký học phần</a>
        <form th:action="@{/logout}" method="post" class="logout-form"><button type="submit">Đăng xuất</button></form>
    </div>
</nav>
<main class="container">
    <div class="page-head">
        <h1>Quản lý sinh viên</h1>
        <a class="btn primary" href="/students/create">+ Thêm sinh viên</a>
    </div>

    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form class="search" method="get" action="/students">
        <input name="keyword" th:value="${keyword}" placeholder="Tìm theo mã hoặc họ tên">
        <button class="btn" type="submit">Tìm kiếm</button>
        <a class="btn" href="/students">Xóa tìm kiếm</a>
    </form>

    <table>
        <thead><tr><th>ID</th><th>Mã SV</th><th>Họ tên</th><th>Email</th><th>SĐT</th><th>Thao tác</th></tr></thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.studentCode}"></td>
            <td th:text="${s.fullName}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.phone}"></td>
            <td>
                <a class="btn small" th:href="@{/students/edit/{id}(id=${s.id})}">Sửa</a>
                <a class="btn small danger" th:href="@{/students/delete/{id}(id=${s.id})}"
                   onclick="return confirm('Bạn có chắc muốn xóa sinh viên này?')">Xóa</a>
                <a class="btn small" th:href="@{/enrollments/student/{id}(id=${s.id})}">Môn đã đăng ký</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}"><td colspan="6" class="empty">Chưa có dữ liệu.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
